# Alerting rules for the LLM Robotic Task-Planning Agent.
#
# These are intentionally conservative, demo-friendly rules. In production you
# would route them through Alertmanager; here they surface on the Prometheus
# "Alerts" page (http://localhost:9090/alerts) and can drive Grafana alerting.

groups:
  - name: planner-availability
    rules:
      # The backend's /metrics target is unreachable for 1 minute.
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Planner backend is down"
          description: "Prometheus has failed to scrape backend:8000/metrics for over 1 minute."

  - name: planner-http
    rules:
      # More than 5% of HTTP responses are 5xx over the last 5 minutes.
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            /
          clamp_min(sum(rate(http_requests_total[5m])), 1)
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated 5xx error rate on the planner backend"
          description: "More than 5% of HTTP responses have been 5xx for 5 minutes."

      # p95 request latency above 1s for 10 minutes.
      - alert: HighRequestLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High p95 request latency"
          description: "95th-percentile request latency has exceeded 1s for 10 minutes."

  - name: planner-domain
    rules:
      # The benchmark completion rate has dropped below 90%. The gauge is only
      # updated when a benchmark run is triggered (GET/POST /api/v1/benchmark),
      # so this fires only after a poor run.
      - alert: LowBenchmarkSuccessRate
        expr: benchmark_success_rate < 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Benchmark task-completion rate below 90%"
          description: "benchmark_success_rate for mode {{ $labels.mode }} is {{ $value }} (< 0.9)."
