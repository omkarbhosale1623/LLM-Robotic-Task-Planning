services:
  backend:
    build:
      context: ./backend
    image: llm-robot-planner-backend
    container_name: llm-robot-backend
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_SCENE: ${DEFAULT_SCENE:-default}
      # Auth (Supabase JWT, always enforced). Set AUTH_REQUIRED=false only for
      # local exploration without Supabase.
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      # Persistence (Supabase Postgres; falls back to in-memory when unset).
      PERSISTENCE_BACKEND: ${PERSISTENCE_BACKEND:-auto}
      DATABASE_URL: ${DATABASE_URL:-}
      # Real-LLM planner (Mistral default; heuristic fallback always works).
      ENABLE_LLM: ${ENABLE_LLM:-true}
      LLM_BACKEND: ${LLM_BACKEND:-mistral}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-large-latest}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - planner-net

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* must be provided at build time (inlined into the bundle).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    image: llm-robot-planner-frontend
    container_name: llm-robot-frontend
    ports:
      - "3000:3000"
    environment:
      # The browser talks to the backend on the host-published port.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - planner-net

  # --- Observability stack -------------------------------------------------
  # Prometheus scrapes backend:8000/metrics; Grafana auto-provisions the
  # datasource + the "LLM Planner — Overview" dashboard. Configs are mounted
  # read-only from ./infra/... so they stay in one place. A standalone variant
  # lives at infra/docker-compose.monitoring.yml.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: llm-robot-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    networks:
      - planner-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: llm-robot-grafana
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - planner-net

volumes:
  prometheus-data:
  grafana-data:

networks:
  planner-net:
    driver: bridge
